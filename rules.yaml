# Каталог правил: связь «нормативный источник -> детектор -> текст обоснования».
# Только акты РК (НБРК, adilet.zan.kz). Ссылки не выдумывать: за неподтверждённые
# источники снимают баллы (критерий 4 ТЗ).
#
# Поля:
#   id        — стабильный идентификатор (используется в dataset/annotations.csv: rule_id)
#   title     — тип нарушения, уходит в поле violations[].type ответа API
#   detector  — имя функции-детектора в worker/events
#   params    — параметры детектора
#   source    — doc (название акта), url (adilet.zan.kz), clause (пункт/раздел)
#   template  — шаблон description (worker/verdict.render_description). Плейсхолдеры:
#               {timecode} — таймкод в секундах («12.3»); {title} {doc} {url} {clause} {rule_id}
#               — из самого правила; прочие ({what_visible} и т.п.) — из Event.facts.
#               Неизвестный плейсхолдер остаётся в тексте как есть (worker не падает).
#               Если шаблон не выводит {clause} и {doc}, ссылка дописывается в конец автоматически.
#   Все поля обязательны, лишние поля запрещены (строгая проверка в worker/events.load_rules).
#
# Общие params, которые читает каждый детектор (Event.timecode_sec):
#   timecode             — какую точку интервала события выдать как таймкод:
#                            start    — первый кадр, где условие выполнено (после сглаживания):
#                                       состояние, которое длится (кассир ушёл, телефон в руке);
#                            action   — кадр самого действия, пик уверенности внутри интервала
#                                       (деньги ушли в карман, передача из рук в руки);
#                            omission — бездействие: момент, когда обязательное действие уже должно
#                                       было произойти (передача денег без пересчёта, вскрытие сумки
#                                       без осмотра) — у самого бездействия своего кадра нет.
#   timecode_offset_sec  — поправка к таймкоду, с; подбирается по evaluate.py (по умолчанию 0.0).
#   Уточнение: найденная точка ищется на кадрах ~5 к/с, затем в окне ±1 с дочитываются кадры
#   полной частоты и берётся точный первый кадр (start/omission) или кадр пика (action).
#   Время кадра — реальный pts из ffmpeg, а не номер/fps (у .mov частота плавает: 29.88–29.92).
#   Кадры-доказательства (Event.evidence_timestamps_sec): таймкод и 1–2 кадра «до/после» (±1 с).
#
# Источники (тексты пунктов сверены на adilet.zan.kz 2026-10-17; цитаты и трактовка —
# docs/legal_sources.md):
#   [231] Правила осуществления кассовых операций и операций по инкассации банкнот, монет
#         и ценностей ... — пост. Правления НБРК от 29.11.2019 № 231 (рег. № 19680),
#         https://adilet.zan.kz/rus/docs/V1900019680
#   [14]  Правила организации охраны и устройства помещений банков второго уровня ... —
#         пост. Правления НБРК от 24.02.2020 № 14 (рег. № 20075),
#         https://adilet.zan.kz/rus/docs/V2000020075
#
# Шаблоны описывают только наблюдаемое; фраза «Это может нарушать п. ... документа «...»»
# дописывается worker'ом. Из facts используется только {what_visible} (в R99).
# Имена detector и params — предложение ML 3; реализация за ML 2 (worker/events).

rules:
  - id: R01_left_during_service
    title: "Кассир покинул рабочее место во время обслуживания клиента"
    detector: "cashier_absent_with_client"
    params:
      timecode: start              # момент, когда кассир вышел из зоны стола
      timecode_offset_sec: 0.0
      min_absence_sec: 3.0
      min_confidence: 0.5
    source:
      doc: "Правила осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей (пост. Правления НБРК от 29.11.2019 № 231)"
      url: "https://adilet.zan.kz/rus/docs/V1900019680"
      clause: "п. 22"
    template: "На {timecode} с кассир выходит из зоны рабочего места, клиент остаётся за столом; обслуживание по видимым признакам не завершено."

  - id: R02_cash_unattended
    title: "Наличные оставлены на рабочем месте без присмотра"
    detector: "cash_on_desk_cashier_absent"
    params:
      timecode: start              # момент, когда кассир ушёл, а деньги остались на столе
      timecode_offset_sec: 0.0
      min_absence_sec: 3.0
      min_confidence: 0.5
    source:
      doc: "Правила осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей (пост. Правления НБРК от 29.11.2019 № 231)"
      url: "https://adilet.zan.kz/rus/docs/V1900019680"
      clause: "п. 20 (часть вторая), п. 22"
    template: "На {timecode} с кассир покинул рабочее место, на столе остаются видимые наличные, не убранные в запирающееся хранилище (ящик, сейф)."

  - id: R03_accept_without_count
    title: "Приём наличных без пересчёта в присутствии клиента"
    detector: "accept_without_count"
    params:
      timecode: omission           # момент, когда принятые деньги убраны без пересчёта
      timecode_offset_sec: 0.0
      min_confidence: 0.5
    source:
      doc: "Правила осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей (пост. Правления НБРК от 29.11.2019 № 231)"
      url: "https://adilet.zan.kz/rus/docs/V1900019680"
      clause: "п. 19 пп. 2), п. 20 (часть первая)"
    template: "На {timecode} с кассир убирает полученные от клиента наличные, не пересчитав их на виду у клиента (ни вручную, ни на счётной машине)."

  - id: R04_issue_without_count
    title: "Выдача наличных без пересчёта в присутствии клиента"
    detector: "issue_without_count"
    params:
      timecode: omission           # момент передачи денег клиенту
      timecode_offset_sec: 0.0
      lookback_sec: 15.0
      min_confidence: 0.5
    source:
      doc: "Правила осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей (пост. Правления НБРК от 29.11.2019 № 231)"
      url: "https://adilet.zan.kz/rus/docs/V1900019680"
      clause: "п. 31 пп. 4)"
    template: "На {timecode} с кассир передаёт клиенту наличные; пересчёт подготовленной суммы в присутствии клиента перед выдачей на видео не наблюдается."

  - id: R05_cash_to_personal
    title: "Наличные помещены в одежду или личные вещи кассира"
    detector: "cash_to_personal"
    params:
      timecode: action             # кадр, где деньги уходят в карман или сумку
      timecode_offset_sec: 0.0
      min_confidence: 0.6
    source:
      doc: "Правила осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей (пост. Правления НБРК от 29.11.2019 № 231)"
      url: "https://adilet.zan.kz/rus/docs/V1900019680"
      clause: "п. 12 (часть первая), п. 20 (часть вторая)"
    template: "На {timecode} с кассир перемещает предмет, похожий на банкноты, в карман одежды или личную сумку, а не в рабочее хранилище."

  - id: R06_phone_at_workplace
    title: "Смартфон в руках кассира на рабочем месте"
    detector: "phone_in_cashier_hand"
    params:
      timecode: start              # момент, когда телефон появился в руке
      timecode_offset_sec: 0.0
      min_duration_sec: 2.0
      min_confidence: 0.6
    source:
      doc: "Правила осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей (пост. Правления НБРК от 29.11.2019 № 231)"
      url: "https://adilet.zan.kz/rus/docs/V1900019680"
      clause: "п. 12 (часть вторая)"
    template: "На {timecode} с кассир держит в руках устройство, похожее на смартфон; в кассовый узел допускаются только средства связи без функции фото- и видеофиксации."

  - id: R07_bag_accepted_unchecked
    title: "Инкассаторская сумка принята без проверки целостности и пломбы"
    detector: "bag_accepted_unchecked"
    params:
      timecode: omission           # момент вскрытия или убирания сумки без осмотра
      timecode_offset_sec: 0.0
      min_confidence: 0.5
    source:
      doc: "Правила осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей (пост. Правления НБРК от 29.11.2019 № 231)"
      url: "https://adilet.zan.kz/rus/docs/V1900019680"
      clause: "п. 24 пп. 3) и 4)"
    template: "На {timecode} с кассир принимает сумку от инкассатора и вскрывает или убирает её без видимого осмотра целостности сумки и пломбы."

  - id: R08_count_without_controller
    title: "Пересчёт или упаковка наличных без контролирующего работника"
    detector: "count_without_controller"
    params:
      timecode: start              # начало пересчёта в одиночку
      timecode_offset_sec: 0.0
      min_duration_sec: 10.0
      min_confidence: 0.5
    source:
      doc: "Правила осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей (пост. Правления НБРК от 29.11.2019 № 231)"
      url: "https://adilet.zan.kz/rus/docs/V1900019680"
      clause: "п. 42"
    template: "С {timecode} с кассир пересчитывает или упаковывает наличные в отсутствие клиента; второго работника в зоне кассы не видно."

  - id: R99_cash_anomaly
    title: "Нетипичное обращение с наличными (требует проверки)"
    detector: "cash_trajectory_anomaly"
    params:
      timecode: action             # пик аномальности траектории денег
      timecode_offset_sec: 0.0
      min_score: 0.8
    source:
      doc: "Правила осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей (пост. Правления НБРК от 29.11.2019 № 231)"
      url: "https://adilet.zan.kz/rus/docs/V1900019680"
      clause: "п. 14"
    template: "На {timecode} с наличные перемещаются нетипично для стандартного сценария обслуживания: {what_visible}. Тип нарушения автоматически не определён, требуется проверка человеком."

# Отложено (в сцене датасета нет окна кассы и лотка; пункты о помещении, а не о действии):
#   - Посторонний в помещении кассы — [14] п. 8, п. 16 пп. 1)
#   - Передача денег в обход транспортирующего устройства — [14] п. 16 пп. 4)
#   - Вскрытие сумки без инкассатора — [231] п. 25 (только при повреждённой сумке)
