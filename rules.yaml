# Каталог правил: связь «нормативный источник -> детектор -> текст обоснования».
# Только акты РК (НБРК, adilet.zan.kz). Ссылки не выдумывать: за неподтверждённые
# источники снимают баллы (критерий 4 ТЗ). Каждый пункт ниже сверен с текстом акта [231]
# или [14] (adilet.zan.kz, редакция на 2026-10-17); цитата пункта — в комментарии над правилом.
#
# Поля:
#   id        — стабильный идентификатор (используется в dataset/annotations.csv: rule_id)
#   title     — тип нарушения, уходит в поле violations[].type ответа API
#   detector  — имя функции-детектора из реестра worker/events/detectors.py: DETECTORS
#   params    — параметры детектора
#   source    — doc (название акта), url (adilet.zan.kz), clause (пункт/раздел)
#   template  — шаблон description (worker/verdict.render_description). Плейсхолдеры:
#               {timecode} — таймкод в секундах («12.3»); {title} {doc} {url} {clause} {rule_id}
#               — из самого правила; {what_visible} — из Event.facts (заполняет каждый детектор).
#               Неизвестный плейсхолдер остаётся в тексте как есть (worker не падает).
#               Если шаблон не выводит {clause} и {doc}, worker дописывает в конец
#               «Это может нарушать <clause> документа «<doc>».» — результат подсказка, не заключение
#               (раздел 7 ТЗ), поэтому шаблон описывает только наблюдаемое (раздел 5 ТЗ).
#   Все поля обязательны, лишние поля запрещены (строгая проверка в worker/events.load_rules).
#
# Параметры, которые читают детекторы (worker/events/detectors.py, значения по умолчанию):
#   p_on 0.6 / p_off 0.4   — гистерезис по ряду «вероятность нарушения»;
#   smooth_points 3        — окно скользящей медианы, точек;
#   min_duration_sec 1.0   — интервалы короче отбрасываются;
#   merge_gap_sec 5.0      — интервалы ближе склеиваются в одно событие;
#   min_confidence 0.5     — порог вывода события в ответ (читает worker/verdict).
#   start_sec 0 / start_p_on 0.97 — интервал, начавшийся в первые start_sec с, остаётся только при
#                            средней p >= start_p_on (состояние с первого кадра — не событие).
#   Свои параметры отдельных детекторов указаны у правил.
#
# timecode / timecode_offset_sec (у правил R01, R02, R06, R15 и в блоке «ЗАПЛАНИРОВАНО») —
#   политика таймкода из исходного каталога: start — первый кадр состояния, action — кадр
#   действия, omission — момент, когда обязательное действие уже должно было произойти;
#   timecode_offset_sec — поправка, с. Текущие детекторы их НЕ читают (таймкод всегда —
#   начало интервала нарушения); загрузчик такие params допускает, значения сохранены
#   как спецификация на будущее.
#
# Источник:
#   [231] Правила осуществления кассовых операций и операций по инкассации банкнот, монет
#         и ценностей ... — пост. Правления НБРК от 29.11.2019 № 231 (рег. № 19680),
#         https://adilet.zan.kz/rus/docs/V1900019680
#   [14]  Правила организации охраны и устройства помещений банков второго уровня, филиалов
#         банков-нерезидентов РК, Национального оператора почты, ... — пост. Правления НБРК
#         от 24.02.2020 № 14 (рег. № 20075), https://adilet.zan.kz/rus/docs/V2000020075
#         (действует, ред. пост. № 105 от 21.09.2020, № 125 от 19.12.2022, № 88 от 24.12.2024;
#         п. 16 до 01.01.2027 действует в редакции, установленной пост. № 88). [231] п. 5
#         отсылает к [14]: устройство кассового узла определяется этими Правилами.
#         Пункты [14] — требования к помещению (изоляция, вход, оборудование кассы), а не прямой
#         запрет действия; поэтому R11/R12 — подсказка проверяющему (раздел 7 ТЗ), не заключение.

rules:
  # [231] п. 22: «Кассовому работнику не допускается покидать рабочее место до окончания
  # обслуживания клиента.»
  - id: R01_left_during_service
    title: "Кассир покинул рабочее место во время обслуживания клиента"
    detector: "left_during_service"
    params:
      timecode: start              # момент, когда кассир вышел из зоны стола
      timecode_offset_sec: 0.0
      min_duration_sec: 3.0        # было min_absence_sec: 3.0 — детектор читает min_duration_sec
      min_confidence: 0.5
      p_on: 0.6
      p_off: 0.4
      smooth_points: 3
      merge_gap_sec: 5.0
    source:
      doc: "Правила осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей (пост. Правления НБРК от 29.11.2019 № 231)"
      url: "https://adilet.zan.kz/rus/docs/V1900019680"
      clause: "п. 22"
    template: "На {timecode} с кассира нет на рабочем месте, в кассе остаётся посетитель."

  # [231] п. 20, часть вторая: «На рабочем месте кассового работника находятся наличные деньги
  # клиента. Все ранее принятые наличные деньги хранятся в специальных устройствах, находящихся
  # на рабочем месте кассового работника, закрывающихся на ключ, предназначенных для хранения
  # наличных денег (металлический шкаф, сейф, тележка, ящики стола, тумба).»; п. 22 — см. R01.
  # Детектор срабатывает и на наличные, и на сумку на столе, поэтому title и template
  # перечисляют то, что видно ({what_visible}: «наличные», «сумка», «наличные и сумка»).
  - id: R02_cash_unattended
    title: "Наличные или сумка оставлены на рабочем месте без присмотра"
    detector: "valuables_unattended"
    params:
      timecode: start              # момент, когда кассир ушёл, а деньги остались на столе
      timecode_offset_sec: 0.0
      # Замер 18.10: нарушение — не уход, а уход с оставленными ценностями (Х-15 сумка, Х-26 купюры;
      # в чистых Х-12, Х-23, Х-29 кассир тоже уходит). Проверка в момент ухода с рабочего места
      # (cashier_left_workplace) по предметам OWLv2 на кадрах, где кассир уже вдали (left_items).
      at_departure: true
      items: ["наличные", "сумка", "планшет"]
      item_score: 0.25             # минимальный score OWLv2 предмета (замер 18.10: купюры 0,34, сумка 0,30, планшет 0,49)
      desk_margin: 0.03            # центр предмета в зоне стола с таким запасом, доля кадра
      min_duration_sec: 3.0        # было min_absence_sec: 3.0 — детектор читает min_duration_sec
      min_confidence: 0.5
      p_on: 0.6
      p_off: 0.4
      smooth_points: 3
      merge_gap_sec: 5.0
    source:
      doc: "Правила осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей (пост. Правления НБРК от 29.11.2019 № 231)"
      url: "https://adilet.zan.kz/rus/docs/V1900019680"
      clause: "п. 20 (часть вторая), п. 22"
    template: "На {timecode} с кассира нет на рабочем месте, на столе остаются без присмотра: {what_visible}."

  # [231] п. 12, часть вторая: «Допускается внос работниками банка в кассовый узел
  # лекарственных средств, медицинских изделий и средств связи, не имеющих функции фото и
  # видео фиксации.»
  - id: R06_phone_at_workplace
    title: "Смартфон в руках кассира на рабочем месте"
    detector: "phone_in_cash_room"
    params:
      timecode: start              # момент, когда телефон появился в руке
      timecode_offset_sec: 0.0
      min_duration_sec: 2.0
      min_confidence: 0.6
      p_on: 0.6
      p_off: 0.4
      smooth_points: 3
      merge_gap_sec: 5.0
    source:
      doc: "Правила осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей (пост. Правления НБРК от 29.11.2019 № 231)"
      url: "https://adilet.zan.kz/rus/docs/V1900019680"
      clause: "п. 12 (часть вторая)"
    template: "На {timecode} с кассир держит в руках устройство, похожее на смартфон; в кассовый узел допускаются только средства связи без функции фото- и видеофиксации."

  # [231] п. 12, часть первая: «Хранение личных вещей, наличных денег и ценностей работников
  # банка осуществляется вне кассового узла в порядке, установленном внутренними документами
  # банка.»
  - id: R09_personal_items
    title: "Личные вещи на рабочем месте кассира"
    detector: "personal_items"
    params:
      # Замер 18.10, кэш r3: пальто на столе по OWLv2-скану стола (desk_coat) — Х-40 на 16,7 с (эталон 17),
      # на чистых ни разу выше 0,3. SigLIP (outerwear_on_desk) оставлен: максимум из двух.
      coat_field: desk_coat
      coat_full: 0.5
      include_bag: false           # сумку на столе учитывает R02 (без присмотра); здесь — только верхняя одежда
      start_sec: 1.5               # одежда «видна» с первого кадра — чаще ошибка зоны стола, а не событие:
      start_p_on: 0.97             # такой интервал остаётся, только если средняя p не ниже этой
      light_guard_sec: 1.0         # начало в пределах 1 с от скачка яркости кадра — эффект света
      min_duration_sec: 1.0
      min_confidence: 0.5
      p_on: 0.6
      p_off: 0.4
      smooth_points: 3
      merge_gap_sec: 5.0
    source:
      doc: "Правила осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей (пост. Правления НБРК от 29.11.2019 № 231)"
      url: "https://adilet.zan.kz/rus/docs/V1900019680"
      clause: "п. 12 (часть первая)"
    template: "С {timecode} с на рабочем столе кассира находится: {what_visible}."

  # [231] п. 20, часть вторая: «... Все ранее принятые наличные деньги хранятся в специальных
  # устройствах, находящихся на рабочем месте кассового работника, закрывающихся на ключ,
  # предназначенных для хранения наличных денег (металлический шкаф, сейф, тележка, ящики
  # стола, тумба).»
  - id: R10_storage_left_open
    title: "Сейф с наличными оставлен открытым"
    detector: "storage_left_open"
    params:
      safe_margin: 0.05            # расширение зоны сейфа, доля кадра
      near_safe_overlap: 0.05      # доля рамки кассира в зоне сейфа, при которой он «у сейфа»
      # Замер 18.10, кэш r2 (зона сейфа — серый шкаф, вырезка шире на 25 %, кадры проверены глазами):
      # «открыт» — рост safe_open над уровнем первых 3 с на 0,25 (Х-20: 0,3–0,5 закрыт, 0,75–0,88
      # открыт); кассир у сейфа — только если он не на своём месте и задевает сейф (away_mode=home:
      # Х-14 на 30 с стоит у сейфа с сумкой перед дверцей). Дольше 7 с: на Х-14 (117 с) кассир сидя
      # открывает сейф рядом со столом и через 6 с закрывает, на Х-20 дверца открыта до конца ролика.
      baseline_sec: 3.0
      baseline_delta: 0.25
      away_mode: home
      home_dist: 0.35              # кассир на месте: центр рамки ближе этого (в ширинах рабочего места)
      require_away: false
      start_sec: 1.5               # «открыт» с первого кадра, пока кассир за столом, — обычный вид сейфа;
      start_p_on: 0.97             # такой интервал остаётся, только если средняя p не ниже этой
      light_guard_sec: 1.0         # начало в пределах 1 с от скачка яркости кадра — эффект света
      min_duration_sec: 7.0        # дольше, чем кассир достаёт из сейфа и закрывает его (Х-14: 6 с)
      min_confidence: 0.5
      p_on: 0.6
      p_off: 0.4
      smooth_points: 3
      merge_gap_sec: 5.0
      # С головой «сейф открыт» (SceneConfig.safe_head, scripts/train_heads.py) — вместо параметров
      # без приставки; baseline_sec с головой всегда 0. Голова видит короткие законные открытия
      # (Х-25: 8–11 и 15–18 с), склейка через 5 с сделала бы из них одно на 10 с.
      head_merge_gap_sec: 2.0
      # Вероятности головы откалиброваны (вне фолда 99 % закрытых кадров < 0,27, открытых — от 0,73):
      # на ракурсе persp закрытый сейф в начале Х-20 даёт 0,66–0,76 — с порогом 0,6 интервал начинался
      # с первого кадра и отбрасывался как «обычный вид сейфа».
      head_p_on: 0.8
      head_p_off: 0.5
      # С дообученной башней (SceneConfig.safe_ft, scripts/finetune_siglip.py) — поверх head_*.
      # Замер 18.10 (многозадачная башня safe_open + desk_cash, вне фолда, 9 вариантов): закрытые q99
      # 0,002–0,015, на cache_persp 0,52 (первые секунды Х-20/Х-33); открытые q05 0,41–0,68, на
      # cache_flip 0,28, на cache_persp 0,13. p_on — выше закрытых q99 всех вариантов с запасом (R10 по
      # кэшам одинаков при p_on 0,6–0,9); p_off — середина открытых q05 (у orig 0,50): при p_off 0,3
      # интервал тянется через промежуточные значения и склеивает законные короткие открытия (Х-25 на
      # flip — ложный R10), а на crop теряется Х-20. Те же 0,8 / 0,5, что у головы.
      ft_p_on: 0.8
      ft_p_off: 0.5
    source:
      doc: "Правила осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей (пост. Правления НБРК от 29.11.2019 № 231)"
      url: "https://adilet.zan.kz/rus/docs/V1900019680"
      clause: "п. 20 (часть вторая)"
    template: "С {timecode} с {what_visible}; кассир не находится у сейфа."

  # [14] п. 8, часть первая: «Кассовый узел подлежит изолированию от других производственных,
  # подсобных, подвальных и служебных помещений одним закрывающимся служебным входом.»;
  # п. 16 пп. 1): «каждая касса имеет отдельный вход с закрывающейся на замок дверью;».
  # Прямого запрета «посторонним входить в кассу» в [14] и [231] нет; пункты устанавливают
  # изолированность кассы. Детектор видит только вход ещё одного человека (не знает, сотрудник
  # ли он), поэтому template описывает наблюдаемое, а не «постороннего».
  - id: R11_outsider_in_cash_room
    title: "Постороннее лицо в помещении кассы"
    detector: "outsider_in_cash_room"
    params:
      max_persons_normal: 2        # кассир и клиент; больше — в кассу вошёл посторонний
      observe_sec: 6.0             # сколько секунд после входа смотреть, где встал вошедший
      cashier_side: 0.3            # проекция на ось «стол -> рабочее место кассира», выше — сторона кассира
      stand_sec: 2.0               # вошедший стоит на стороне кассира не меньше, с
      third_min_sec: 2.0           # «третий человек» и без засчитанного входа: больше max_persons_normal подряд, с
      min_duration_sec: 1.0        # вошедший остаётся в кассе не меньше, с
      min_confidence: 0.5
      merge_gap_sec: 2.0            # входы ближе 2 с — один вход (5 с склеивали вход третьего с ранним, Х-18)
    source:
      doc: "Правила организации охраны и устройства помещений банков второго уровня, филиалов банков-нерезидентов Республики Казахстан, Национального оператора почты, ... (пост. Правления НБРК от 24.02.2020 № 14)"
      url: "https://adilet.zan.kz/rus/docs/V2000020075"
      clause: "п. 8 (часть первая), п. 16 пп. 1)"
    template: "На {timecode} с в помещение кассы входит ещё один человек: {what_visible}."

  # [231] п. 20, часть вторая: «На рабочем месте кассового работника находятся наличные деньги
  # клиента. Все ранее принятые наличные деньги хранятся в специальных устройствах, находящихся
  # на рабочем месте кассового работника, закрывающихся на ключ, предназначенных для хранения
  # наличных денег (металлический шкаф, сейф, тележка, ящики стола, тумба).» (см. R02).
  # Решение команды 17.10.2026: в Х-4 (57 с) и Х-38 (33 с) нарушение — следующий посетитель
  # входит, когда на столе ещё лежат наличные. Чьи это деньги, детектор не знает, поэтому
  # template описывает только наблюдаемое.
  - id: R14_cash_on_desk_at_entry
    title: "Наличные не убраны в хранилище до входа следующего посетителя"
    detector: "entry_with_cash_on_desk"
    params:
      # Замер 18.10, кэш r3: наличные на столе по OWLv2-скану (desk_cash): SigLIP по всей вырезке стола
      # пачку не видит (<= 0,004). Х-38 — вход на 31 с (эталон 33), на чистых — ни разу.
      field: desk_cash
      cash_p: 0.5                  # порог «на столе наличные» в последние before_sec до входа
      before_sec: 2.0
      after_sec: 2.0               # и 2 с после входа: стол сканируется раз в 2 с (Х-4: вход 55,3, наличные видны с 58)
      min_duration_sec: 1.0        # вошедший остаётся в кассе не меньше, с
      min_confidence: 0.5
      smooth_points: 3
      merge_gap_sec: 2.0            # входы ближе 2 с — один вход (5 с склеивали вход третьего с ранним, Х-18)
      # С дообученной башней (SceneConfig.safe_ft, meta.safe_ft.fields с desk_cash): поле desk_cash_ft —
      # вероятность башни раз в 1 с вместо OWLv2 (desk_cash OWLv2 не меняется — у прочих потребителей
      # остаётся скан; башня путает банки напитка и планшет с деньгами, Х-24, Х-25). Замер 18.10 (вне фолда, 9 вариантов):
      # распределение двугорбое, ошибки уверенные — у «нет» 183 из 6984 выборок >= 0,8 (134 >= 0,95),
      # между 0,2 и 0,8 — 43; у «есть» 152 из 2493 < 0,8. Порог 0,8 — выше середины «нет», ниже 93 %
      # «есть»; окно R14 берёт максимум за 4 с, а наличные лежат на столе подолгу.
      ft_field: desk_cash_ft
      ft_cash_p: 0.8
      # «Пустое окно» (empty_before_sec > 0): вход засчитывается, только если в [t − empty_before_sec, t)
      # был отрезок >= empty_min_sec, когда в кассе был один кассир (предыдущий посетитель ушёл — деньги на
      # столе не принадлежат вошедшему; вход третьего при стоящем клиенте не проверяется). 0 — выключено.
      # Замер 18.10 (вне фолда на всех секундах, 5 вариантов): без окна башня даёт ложные R14 на чистых
      # Х-19 (13 с, все варианты), Х-3 (17 с, persp/light), Х-5+48 (crop) и лишние на Х-18; с окном 6 с —
      # 0 ложных, Х-4 на base/flip/crop/light сохраняется (порог ft_cash_p 0,5–0,95 — без разницы).
      ft_empty_before_sec: 6.0
      ft_empty_min_sec: 0.3
    source:
      doc: "Правила осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей (пост. Правления НБРК от 29.11.2019 № 231)"
      url: "https://adilet.zan.kz/rus/docs/V1900019680"
      clause: "п. 20 (часть вторая)"
    template: "На {timecode} с в кассу входит посетитель, а на рабочем столе видны наличные."

  # [14] п. 16 пп. 4): «передняя часть кассы оборудуется специальными транспортирующими
  # устройствами для передачи наличных денег и ценностей. Механизм приведения в действие и
  # фиксации транспортирующего устройства находится внутри кассы в исправном состоянии.
  # Допускается оборудовать нижнюю переднюю часть кассы инкассаторским бункером, позволяющим
  # принимать и выдавать более 10 (десяти) пачек банкнот и (или) 5 (пяти) мешков монет;»
  # (в ред. пост. № 88, действует до 01.01.2027); п. 16 пп. 1) — см. R11.
  # Детектор: инкассаторская сумка в кассе при другом человеке в комнате.
  - id: R12_collection_inside
    title: "Передача инкассаторской сумки внутри кассы"
    detector: "collection_inside"
    params:
      min_duration_sec: 1.0
      min_confidence: 0.5
      p_on: 0.6
      p_off: 0.4
      smooth_points: 3
      merge_gap_sec: 5.0
    source:
      doc: "Правила организации охраны и устройства помещений банков второго уровня, филиалов банков-нерезидентов Республики Казахстан, Национального оператора почты, ... (пост. Правления НБРК от 24.02.2020 № 14)"
      url: "https://adilet.zan.kz/rus/docs/V2000020075"
      clause: "п. 16 пп. 4)"
    template: "С {timecode} с видно: {what_visible}."

  # [231] п. 12, часть первая — см. R09; часть вторая: «Допускается внос работниками банка
  # в кассовый узел лекарственных средств, медицинских изделий и средств связи, не имеющих
  # функции фото и видео фиксации.» Напитков и еды в перечне допустимого нет (трактовка:
  # прямого пункта о приёме пищи/напитков на рабочем месте кассира нет ни в [231], ни в [14]).
  - id: R13_drink_at_workplace
    title: "Напиток или еда на рабочем месте кассира"
    detector: "drink_at_workplace"
    params:
      # Замер 18.10, кэш r3: стакан на столе по OWLv2-скану (desk_cup) вместо COCO у рук: Х-46 — 1,0 на
      # 10 с (эталон 11); на чистых до 0,74 (Х-14), поэтому порог 0,85.
      field: desk_cup
      min_duration_sec: 1.0
      min_confidence: 0.5
      p_on: 0.85
      p_off: 0.6
      smooth_points: 3
      merge_gap_sec: 5.0
    source:
      doc: "Правила осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей (пост. Правления НБРК от 29.11.2019 № 231)"
      url: "https://adilet.zan.kz/rus/docs/V1900019680"
      clause: "п. 12"
    template: "С {timecode} с на рабочем месте видно: {what_visible}."

  # [14] п. 8, часть первая — см. R11; п. 16 пп. 1): «каждая касса имеет отдельный вход с
  # закрывающейся на замок дверью;». [231] п. 5 отсылает к [14]: устройство кассового узла.
  # Прямого требования «держать дверь кассы закрытой во время работы» нет ни в [14], ни в [231]
  # (весь текст [231] просмотрен 18.10.2026: о дверях — только кладовая и сейфовая комната,
  # пп. 75, 76, 78, 80), поэтому R15 — подсказка проверяющему, как R11, а не прямой запрет.
  # Позитивы: Х-32 (5 с, дверь открыта до конца ролика), Х-33 (6 с; на 10–14 с в открытую дверь
  # входит человек — это ещё и R11).
  # Детектор: полоса двери не вернулась к виду первых секунд ролика (door_change, worker.perception.door),
  # у двери никого нет, свет как в начале, перед этим через дверь проходили. Вопрос SigLIP «открыта /
  # закрыта» по стеклянной двери ненадёжен (SceneConfig.enable_door_state = False).
  # Замер 18.10 по кадрам (зона двери вручную, без закрашивания людей): Х-32 и Х-33 — 0,77–0,99 больше
  # 10 с; вход с закрытием двери (Х-3, Х-5, Х-19, Х-31, Х-35, Х-37) и уход кассира (Х-15, Х-22–Х-29) —
  # всплеск на 2–4 с прохода, поэтому min_duration_sec 6 и merge_gap_sec 1; свет гаснет при уходе
  # (Х-11, Х-12: яркость кадра −0,16…−0,22, у позитивов ±0,02) — light_tol 0,06. Ограничение: ролик
  # должен начинаться с закрытой двери (эталон — первые baseline_sec секунд). Замер по кэшу — на GPU.
  # Замер R15 18.10 по кэшу (dep/raw_base, docs/ml_measurement.md «Замер R15, 18.10»): p_on 0,6 давал ложное
  # на Х-39 53 с (посетитель сидит, створка прикрыта неплотно — door_diff 0,56 удерживается 20 с; по разметке не
  # нарушение). Удерживаемый 6 с уровень door_diff: Х-32 0,71, Х-33 0,80, Х-30 0,68 (это R11, не R15 — отсекает фильтр прохода),
  # Х-39 0,56, вход/уход ≤ 0,34. p_on 0,9 (diff ≥ 0,62) / p_off 0,5: Х-39 уходит на оригинале, flip, light, crop;
  # Х-32 и Х-33 остаются (flip 4,3 / 4,3 с). У 14 из 42 роликов зона двери OWLv2 на соседней панели — там R15 слеп.
  - id: R15_door_left_open
    title: "Дверь кассы оставлена открытой"
    detector: "door_left_open"
    params:
      timecode: start              # момент, когда вошедший отошёл от открытой двери
      timecode_offset_sec: 0.0
      field: door_change
      settle_sec: 2.5              # таймкод — первый кадр, после которого 2,5 с у двери никого (отошли от двери)
      settle_max_sec: 6.0          # не дальше 6 с от начала интервала, иначе — начало
      baseline_sec: 1.0            # эталон яркости кадра — первые секунды ролика (как у вида двери)
      light_tol: 0.06              # яркость кадра отличается от начала больше — не оценивать (свет погас)
      light_guard_sec: 1.0         # начало в пределах 1 с от скачка яркости кадра — эффект света
      door_margin: 0.03            # расширение зоны двери, доля кадра
      door_person_ioa: 0.5         # доля рамки человека в зоне двери, при которой он «у двери»
      passage_sec: 8.0             # проход через дверь не раньше чем за столько секунд до начала
      min_duration_sec: 6.0        # проход с открыванием и закрыванием — 2–4 с
      min_confidence: 0.5
      p_on: 0.9                    # door_diff ≥ 0,62: Х-39 (створка неплотно, 0,56–0,58) — не нарушение
      p_off: 0.5                   # door_diff 0,50
      smooth_points: 3
      merge_gap_sec: 1.0           # два прохода подряд (уход клиента и вход следующего) — не одно событие
    source:
      doc: "Правила организации охраны и устройства помещений банков второго уровня, филиалов банков-нерезидентов Республики Казахстан, Национального оператора почты, ... (пост. Правления НБРК от 24.02.2020 № 14)"
      url: "https://adilet.zan.kz/rus/docs/V2000020075"
      clause: "п. 8 (часть первая), п. 16 пп. 1)"
    template: "С {timecode} с {what_visible}."

