#
# Отложено в исходном каталоге (пункты о помещении, а не о действии; в сцене датасета нет
# окна кассы и лотка):
#   - Передача денег клиенту в обход транспортирующего устройства — [14] п. 16 пп. 4)
#     (передачу инкассаторской сумки внутри кассы покрывает R12)
#     Детектор позы для неё есть — hand_to_hand_transfer (кисть кассира у кисти другого
#     человека над столом, Х-1, Х-2, Х-13, Х-18, Х-47); является ли передача из рук в руки
#     нарушением и по какому пункту — решение команды (вопрос 1 задания по позе). До решения
#     правило не заводится. Если обычная передача клиенту — норма: params.min_persons: 3.
#   - Вскрытие сумки без инкассатора — [231] п. 25 (только при повреждённой сумке)
#
# Альтернативные детекторы позы для включённых правил (переключать detector только если по
# кэшу с позой лучше и без новых ложных тревог; без ENABLE_POSE=1 они событий не дают):
#   - R10_storage_left_open: detector "storage_left_open_pose" — руки кассира в сейфе
#     >= 0,7 с (params.min_work_sec), затем отошёл, сейф открыт; таймкод — момент ухода (Х-20).
#     Остальные params те же (safe_margin, near_safe_overlap, p_on/p_off, min_duration_sec);
#     свой — open_window_sec: 4.0.
#   - R13_drink_at_workplace: detector "drink_or_phone_at_face" — рука у лица >= 1 с и в кадре
#     стакан/еда или телефон; таймкод — подъём руки (Х-46, 11 с). Решение по R13 — за командой.
